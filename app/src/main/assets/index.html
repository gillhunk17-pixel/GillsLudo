<title>Gill’s Ludo</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff7e8;--fg:#2b1d0e;--card:#fff;--acc:#d4570a;--board:#ffe9b8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17120c;--fg:#f6ead6;--card:#261e14}}
:root[data-theme="dark"]{--bg:#17120c;--fg:#f6ead6;--card:#261e14}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
.d{--acc:#d4570a;--board:#ffe9b8}.k{--acc:#15803d;--board:#d9f2d0}.v{--acc:#8a5a2b;--board:#f3e2c3}.j{--acc:#2f6b2a;--board:#cfe8b0}.s{--acc:#b3261e;--board:#dfe3f7}
[hidden]{display:none!important}
body{margin:0;font-family:'Baloo 2','Noto Sans Devanagari',system-ui,sans-serif;background:var(--bg);color:var(--fg);text-align:center;-webkit-tap-highlight-color:transparent}
main{max-width:760px;margin:0 auto;padding:6px}
h1{margin:6px 0;font-size:2rem;color:var(--acc)}
.g{margin:12px 0}.g b{display:block;margin-bottom:5px}
.seg{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
button{font:inherit;border:2px solid var(--acc);background:var(--card);color:var(--fg);border-radius:10px;padding:8px 14px}
button.on,.go{background:var(--acc);color:#fff}
button:disabled{opacity:.5}
.go{font-size:1.2rem;padding:10px 26px;margin:10px 0}
button:focus-visible,a:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
a{color:var(--acc);font-weight:700}
#st{min-height:3.2em;font-size:1.1rem;padding-top:4px}
.dc{display:inline-grid;grid-template:repeat(3,1fr)/repeat(3,1fr);width:46px;height:46px;padding:6px;gap:2px;background:#fff;border-radius:10px;vertical-align:middle;box-shadow:0 2px 4px #0005}.dc i{border-radius:50%}.dc .p{background:#222}
#rb:disabled{opacity:.85}
.dc.r{animation:tum .8s ease-out}
@keyframes tum{0%{transform:perspective(300px) rotate3d(1,1,0,0deg)}20%{transform:perspective(300px) rotate3d(1,1,0,160deg) translateY(-14px) scale(1.12)}45%{transform:perspective(300px) rotate3d(1,.5,.5,330deg)}65%{transform:perspective(300px) rotate3d(.5,1,1,500deg) translateY(-8px) scale(1.08)}85%{transform:perspective(300px) rotate3d(1,1,0,680deg)}100%{transform:perspective(300px) rotate3d(1,1,0,720deg)}}
@media (prefers-reduced-motion:reduce){.dc.r{animation:none}}
.b{position:relative;width:min(calc(100vw - 14px),720px);height:min(calc(100vw - 14px),720px);aspect-ratio:1;margin:8px auto;background:var(--board);border-radius:12px;overflow:hidden;border:3px solid var(--acc);color:#2b1d0e}
.b div{position:absolute}
.c{border:1px solid #0003;background:#fffdf6;font-size:calc(min(calc(100vw - 14px),720px)/24);line-height:1;display:flex;align-items:center;justify-content:center}
.t{border:0;transition:left .2s,top .2s;z-index:3;filter:drop-shadow(0 2px 2px #0008)}
.t::before,.t::after{content:"";position:absolute}
.t::before{left:24%;top:0;width:52%;height:46%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fffb,#fff0 45%),var(--c);box-shadow:0 0 0 1.5px #fff}
.t::after{left:6%;bottom:0;width:88%;height:62%;border-radius:50% 50% 22% 22%/70% 70% 22% 22%;background:radial-gradient(circle at 50% 38%,#fff 0 13%,#fff0 15%),linear-gradient(90deg,#0004,#fff3 40%,#0000 62%,#0005),var(--c);box-shadow:0 0 0 1.5px #fff}
.t.can{animation:p .6s infinite alternate;cursor:pointer;z-index:4}
@keyframes p{to{transform:scale(1.35)}}
@media (prefers-reduced-motion:reduce){.t{transition:none}.t.can{animation:none;outline:3px solid #000}}
#bar{display:flex;align-items:center;gap:8px;position:relative}
#bar #st{flex:1;text-align:left}
#dt{font-size:1.7rem;line-height:1;padding:2px 12px}
#mn a{display:block;padding:8px 14px;border:2px solid var(--acc);border-radius:10px;background:var(--card);text-decoration:none;color:var(--fg);font-weight:500}
#mn{position:absolute;right:0;top:100%;z-index:20;background:var(--card);border:2px solid var(--acc);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px;min-width:200px;text-align:left;box-shadow:0 6px 18px #0006}
.dw{display:inline-block;width:40px;height:40px;perspective:240px;vertical-align:middle;margin-right:6px}
.cube{--h:20px;position:relative;display:block;width:40px;height:40px;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.2,.7,.3,1)}
.fc{position:absolute;top:0;right:0;bottom:0;left:0;background:#fff;border:1px solid #aaa;border-radius:10px;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:5px;gap:1px;backface-visibility:hidden}
.fc i{border-radius:50%}.fc .p{background:#222}
.dw.r{animation:hop .8s}
@keyframes hop{0%,100%{transform:translateY(0)}30%{transform:translateY(-12px) scale(1.1)}60%{transform:translateY(-4px)}80%{transform:translateY(-8px)}}
@media (prefers-reduced-motion:reduce){.cube{transition:none}.dw.r{animation:none}}
#gm{background:color-mix(in srgb,var(--turn,transparent) 18%,transparent);border-radius:16px;padding:6px;transition:background .3s}
.b{border-color:var(--turn,var(--acc))}
@keyframes blk{0%,100%{filter:brightness(1);box-shadow:inset 0 0 0 0 #fff0}50%{filter:brightness(1.45);box-shadow:inset 0 0 0 5px #fff}}

function mStep(i,t){const k=i%16,o=(f,d,ty,v,e)=>{const x=AC.createOscillator(),g=AC.createGain();x.type=ty;x.frequency.setValueAtTime(f,t);if(e)x.frequency.exponentialRampToValueAtTime(e,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);x.connect(g);g.connect(AC.destination);x.start(t);x.stop(t+d)};if(KK[k])o(140,.18,'sine',.2,50);if(HH[k])o(900,.05,'square',.025);if(MM[k])o(MM[k],.22,'triangle',.06)}
function music(on){clearInterval(mT);mT=null;if(!on)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state=='suspended')AC.resume();mN=AC.currentTime+.1;mS=0;mT=setInterval(()=>{while(mN<AC.currentTime+.3){mStep(mS++,mN);mN+=.19}},80)}catch(e){}}

tell(dot(s)+(D==6?X.six:'Rolled '+D)+(!isCPU(s)?'. Tap a token':''));
if(isCPU(s))later(()=>move(pick(s)),700)}
function move(i){const s=cur(),X=TX[cfg.th];if(ph!='move')return;ph='anim';const cap=capt(s,i);CAN=[];const p0=P[s][i],np=p0<0?0:p0+D,sq=[];for(let q=p0<0?0:p0+1;q<=np;q++)sq.push(q);const g=gid;let k=0;
function stp(){if(g!=gid)return;if(paused){setTimeout(stp,200);return}P[s][i]=sq[k++];snd('step');render();upd();if(k<sq.length)setTimeout(stp,230);else fin()}
function fin(){if(cap){CP[s]++;snd('cut');S.forEach(o=>{if(o!=s)P[o].forEach((q,j)=>{if(q>=0&&q<51&&np<51&&(ST[o]+q)%52==(ST[s]+np)%52)P[o][j]=-1})})}render();upd();
if(P[s].every(p=>p==56)){ph='end';const pt=100+CP[s]*10;addWin(NM[s]);addPts(NM[s],pt);snd('win');tell(dot(s)+NM[s]+' wins! 🎉🏆<br>⭐ +'+pt+' reward points (100 for the win + 10 per capture)');$('rb').disabled=true;return}
const home=np==56;if(home)snd('home');tell(dot(s)+(cap?X.cap:home?X.home:NM[s]+' moved a token'));
later(()=>(D==6||cap||home)?turnStart():next(),800)}
stp()}
$('mu').onclick=()=>{musicOn=!musicOn;if(SG.length){musicOn?au.play().catch(()=>{}):au.pause()}else music(musicOn);$('mu').textContent=musicOn?'🎵 Music on':'🔇 Music off'};
$('sn').onclick=()=>{mute=!mute;$('sn').textContent=mute?'🔇 Sound off':'🔊 Sound on'};
function pauseUI(m){if(paused||ph=='end')return;paused=true;$('pt').textContent=m;$('ps').hidden=false;$('mn').hidden=true;au.pause();music(false);upd()}
function resume(){paused=false;$('ps').hidden=true;if(musicOn){SG.length?au.play().catch(()=>{}):music(true)}upd()}
$('pz').onclick=()=>pauseUI('⏸ Game paused');$('hm').onclick=()=>{if(ph=='end')$('nw').onclick();else pauseUI('Leave this game?')};$('rs').onclick=resume;$('gh').onclick=()=>$('nw').onclick();
$('dt').onclick=()=>{const m=$('mn');m.hidden=!m.hidden;$('dt').setAttribute('aria-expanded',String(!m.hidden))};
document.addEventListener('click',e=>{if(!e.target.closest('#bar'))$('mn').hidden=true});
$('pk').onclick=()=>$('fl').click();
$('fl').onchange=e=>{SG=[...e.target.files];if(SG.length){music(false);musicOn=true;$('mu').textContent='🎵 Music on';$('nx').hidden=false;nextSong()}};
$('nx').onclick=nextSong;
$('rb').onclick=roll;
$('go').onclick=startGame;
$('nw').onclick=()=>{$('mn').hidden=true;music(false);au.pause();gid++;ph='end';paused=false;$('ps').hidden=true;$('gm').hidden=true;$('su').hidden=false;home(true);lb()};
$('wa').href='https://wa.me/?text='+encodeURIComponent('Come play Gill’s Ludo! '+(location.protocol=='file:'?'https://play.google.com/store/apps/details?id=com.gill.ludo':location.href));
theme();lb();home(true);pr();$('pr').onclick=()=>{cfg.n=cfg.n==4?2:cfg.n+1;pr()};
</script></body></html>
